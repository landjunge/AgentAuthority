name: A1 Linux read-only preflight

on:
  push:
    branches: [codex/a1-linux-preflight-20261012]
    paths:
      - .github/workflows/a1-linux-preflight.yml
      - docs/a1-linux-preflight/2026-10-12/probe.py

permissions:
  contents: read

jobs:
  metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read fixed environment metadata without activating observers
        run: python3 -B docs/a1-linux-preflight/2026-10-12/probe.py --label github-actions
