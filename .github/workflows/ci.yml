name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Pytest again (determinism check)
        run: pytest -q
      - name: Install quality tools
        run: pip install ruff==0.17.0 bandit==1.9.4 mypy==2.4.0
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Bandit
        run: bandit -r lab/ -ll
      - name: Mypy strict
        run: mypy lab/ --strict
