[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-authority-lab"
dynamic = ["version"]
description = "Agent Authority observer preview and historical research lab"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "landjunge" }]
dependencies = []

[project.scripts]
agent-authority = "agent_authority.cli:main"
agent-authority-browser = "agent_authority.browser:main"

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["lab*", "agent_authority*"]

[tool.setuptools.dynamic]
version = {attr = "agent_authority.__version__"}

[tool.setuptools.package-data]
agent_authority = ["browser_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
